{% extends 'base.html' %}
{% block title %}sign up{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<section class="auth-root">
<div class="auth-card">
<div class="brand">mycard</div>
<h2 class="h">create an account</h2>
<p class="muted">start creating your personal cards</p>


<form method="post" action="/register" class="auth-form" novalidate>
	{{ form.hidden_tag() }}
<label class="field">
<span class="label">Username</span>
<input name="username" type="text" required autocomplete="username" placeholder="choose a username">
</label>


<label class="field">
<span class="label">Password</span>
<div class="pw-wrap">
<input name="password" type="password" required autocomplete="new-password" placeholder="at least 6 chars">
<button type="button" class="show-pw" aria-label="Toggle show password">👁️</button>
</div>
</label>


<button class="btn primary" type="submit">create account</button>
</form>


<div class="foot">already have an account? <a href="/login">login</a></div>
</div>
</section>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
