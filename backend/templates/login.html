{% extends 'base.html' %}
{% block title %}login{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<section class="auth-root">
<div class="auth-card">
<div class="brand">mycard</div>
<h2 class="h">welcome back</h2>
<p class="muted">login to access your cards</p>


<form method="post" action="/login" class="auth-form" novalidate>
	{{ form.hidden_tag() }}
<label class="field">
<span class="label">Username</span>
<input name="username" type="text" required autocomplete="username" placeholder="your-username">
</label>


<label class="field">
<span class="label">Password</span>
<div class="pw-wrap">
<input name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
<button type="button" class="show-pw" aria-label="Toggle show password">👁️</button>
</div>
</label>


<button class="btn primary" type="submit">login</button>
</form>


<div class="foot">no account? <a href="/register">create one</a></div>
</div>
</section>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
